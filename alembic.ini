[alembic]
script_location = twitchmarkov/db/migrations

# Not used at runtime: run_migrations() in twitchmarkov/db/engine.py sets
# sqlalchemy.url programmatically from DATABASE_URL. This is only here so
# `alembic revision`/`alembic upgrade` work from the CLI during development.
sqlalchemy.url = sqlite+aiosqlite:///./data/twitchmarkov.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
